[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-learning-analytics"
version = "0.1.0"
description = "A reproducible STEM question classification feasibility study."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=4.0,<5",
  "joblib>=1.4,<2",
  "jinja2>=3.1,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "reportlab>=4.2,<5",
  "scikit-learn>=1.6,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pypdf>=5,<7", "pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[project.scripts]
stem-analytics = "stem_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

